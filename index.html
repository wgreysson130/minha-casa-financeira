<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b2a"><title>Minha Casa Financeira</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172b2b;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#102b2a;color:white;padding:30px 20px 24px}main{max-width:680px;margin:auto;padding:18px 16px 70px}h1{font-size:24px;margin:0 0 5px}h2{font-size:18px;margin:26px 0 12px}.muted{color:#6a7776;font-size:13px}.hero{font-size:34px;font-weight:800;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 12px #0a2c2410;margin-bottom:12px}.stats .card{margin:0}.amount{font-size:21px;font-weight:750;margin-top:6px}.green{color:#087b5a}.red{color:#c23845}.actions{display:flex;gap:10px;margin:20px 0}button{border:0;background:#0e7865;color:white;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:650;cursor:pointer}.actions button{flex:1}.secondary{background:#e5eeeb;color:#19483d}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e8eeeb;padding:12px 0}.item:last-child{border:0}.item small{display:block;color:#71817c;margin-top:4px}.item button{padding:6px 9px;font-size:12px}.controls{display:flex;gap:6px;align-items:center}.controls button{background:#e8efec;color:#274c43}.controls button.delete{color:#bd3041}.pill{font-size:11px;padding:3px 7px;border-radius:12px;background:#fff1d5;color:#855d12;display:inline-block;margin-top:4px}.paid{background:#e1f5eb;color:#087b5a}.warning{background:#fff0e9;border-left:4px solid #d75a36;padding:14px;border-radius:10px;margin-top:12px}dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,450px);box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0008}label{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}input,select{width:100%;border:1px solid #cbd8d3;border-radius:10px;padding:12px;font-size:16px;background:white}form .buttons{display:flex;gap:8px;margin-top:20px}form .buttons button{flex:1}.empty{text-align:center;color:#82908a;padding:22px}footer{text-align:center;margin-top:20px}footer button{font-size:12px;background:transparent;color:#667a73;padding:8px}</style></head><body><header><div style="max-width:680px;margin:auto"><h1>🏡 Minha Casa Financeira</h1><div style="opacity:.75;font-size:13px">Seu dinheiro organizado, dia após dia</div><div style="margin-top:22px;font-size:13px;opacity:.8">Saldo disponível hoje</div><div id="current" class="hero">R$ 0,00</div></div></header><main><div class="stats"><div class="card"><div class="muted">Entradas futuras</div><div class="amount green" id="income">—</div></div><div class="card"><div class="muted">Contas pendentes</div><div class="amount red" id="expenses">—</div></div></div><div class="actions"><button onclick="openForm('income')">+ Recebimento</button><button onclick="openForm('expense')" style="background:#b74648">+ Despesa</button></div><div class="card"><div class="muted">Saldo projetado após os lançamentos</div><div class="amount" id="projected">—</div><div id="warning"></div></div><h2>Próximos lançamentos</h2><div class="card" id="transactions"></div><footer><button onclick="exportData()">Exportar backup</button><button onclick="document.getElementById('file').click()">Importar backup</button><input id="file" type="file" accept="application/json" hidden onchange="importData(event)"><div class="muted">Dados armazenados neste navegador. Faça backups regularmente.</div></footer></main><dialog id="editor"><form id="form"><h2 id="formTitle">Novo lançamento</h2><input type="hidden" id="editId"><label>Descrição</label><input id="description" required maxlength="100" placeholder="Ex.: Aluguel"><label>Valor (R$)</label><input id="value" type="number" min="0.01" step="0.01" required><label>Data</label><input id="date" type="date" required><label>Tipo</label><select id="type"><option value="income">Recebimento</option><option value="expense">Despesa</option></select><label>Estado</label><select id="status"><option value="pending">Pendente</option><option value="paid">Recebido / pago</option></select><div class="buttons"><button type="button" class="secondary" onclick="document.getElementById('editor').close()">Cancelar</button><button type="submit">Salvar</button></div></form></dialog><script>
const KEY='minha-casa-financeira-v1';const seed=[{id:'a',description:'Pagamento 1',value:2800,date:'2026-11-26',type:'expense',status:'pending'},{id:'b',description:'Pagamento 2',value:810,date:'2026-11-26',type:'expense',status:'pending'},{id:'c',description:'Recebimento',value:1600,date:'2026-11-29',type:'income',status:'pending'},{id:'d',description:'Recebimento',value:550,date:'2026-12-01',type:'income',status:'pending'},{id:'e',description:'Recebimento',value:1600,date:'2026-12-05',type:'income',status:'pending'}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.items)){state={base:2000,items:seed};save()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);const today=()=>new Date().toLocaleDateString('en-CA');const dateBR=s=>s.split('-').reverse().join('/');function balance(){return state.base+state.items.filter(x=>x.status==='paid').reduce((s,x)=>s+(x.type==='income'?x.value:-x.value),0)}function render(){let current=balance(),pending=state.items.filter(x=>x.status==='pending'),future=pending.reduce((s,x)=>s+(x.type==='income'?x.value:-x.value),current);document.getElementById('current').textContent=money(current);document.getElementById('income').textContent=money(pending.filter(x=>x.type==='income').reduce((s,x)=>s+x.value,0));document.getElementById('expenses').textContent=money(pending.filter(x=>x.type==='expense').reduce((s,x)=>s+x.value,0));document.getElementById('projected').textContent=money(future);let running=current,shortfall=null;for(const x of [...pending].sort((a,b)=>a.date.localeCompare(b.date)|| (a.type==='expense'?-1:1))){running+=x.type==='income'?x.value:-x.value;if(running<0&&!shortfall)shortfall={date:x.date,value:-running}}document.getElementById('warning').innerHTML=shortfall?`<div class="warning">⚠️ Pode faltar <b>${money(shortfall.value)}</b> em ${dateBR(shortfall.date)}. Confira os vencimentos.</div>`:'';const container=document.getElementById('transactions');container.innerHTML='';let items=[...state.items].sort((a,b)=>a.date.localeCompare(b.date));if(!items.length)container.innerHTML='<div class="empty">Nenhum lançamento ainda.</div>';for(const x of items){let div=document.createElement('div');div.className='item';let left=document.createElement('div');let name=document.createElement('strong');name.textContent=x.description;left.append(name);let meta=document.createElement('small');meta.textContent=dateBR(x.date)+' · '+(x.type==='income'?'Entrada':'Saída');left.append(meta);let pill=document.createElement('span');pill.className='pill '+(x.status==='paid'?'paid':'');pill.textContent=x.status==='paid'?(x.type==='income'?'Recebido':'Pago'):'Pendente';left.append(pill);let right=document.createElement('div');right.style.textAlign='right';let amount=document.createElement('strong');amount.className=x.type==='income'?'green':'red';amount.textContent=(x.type==='income'?'+':'−')+money(x.value);right.append(amount);let controls=document.createElement('div');controls.className='controls';controls.style.marginTop='7px';for(const [label,action,cls] of [[x.status==='paid'?'↩':'✓',()=>toggle(x.id),''],['Editar',()=>openForm(null,x.id),''],['×',()=>remove(x.id),'delete']]){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=action;controls.append(b)}right.append(controls);div.append(left,right);container.append(div)}}function openForm(type='expense',id=''){let x=state.items.find(i=>i.id===id);document.getElementById('editId').value=id;document.getElementById('formTitle').textContent=x?'Editar lançamento':'Novo lançamento';document.getElementById('description').value=x?.description||'';document.getElementById('value').value=x?.value||'';document.getElementById('date').value=x?.date||today();document.getElementById('type').value=x?.type||type;document.getElementById('status').value=x?.status||'pending';document.getElementById('editor').showModal()}document.getElementById('form').onsubmit=e=>{e.preventDefault();let id=document.getElementById('editId').value;let x={id:id||String(Date.now()),description:document.getElementById('description').value.trim(),value:Number(document.getElementById('value').value),date:document.getElementById('date').value,type:document.getElementById('type').value,status:document.getElementById('status').value};if(!x.description||!Number.isFinite(x.value)||x.value<=0)return;if(id)state.items=state.items.map(i=>i.id===id?x:i);else state.items.push(x);save();render();document.getElementById('editor').close()};function toggle(id){let x=state.items.find(i=>i.id===id);x.status=x.status==='paid'?'pending':'paid';save();render()}function remove(id){if(confirm('Excluir este lançamento?')){state.items=state.items.filter(x=>x.id!==id);save();render()}}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minha-casa-financeira-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.items)||typeof obj.base!=='number')throw Error();if(confirm('Substituir os dados atuais pelo backup?')){state=obj;save();render()}}catch{alert('Arquivo de backup inválido')}e.target.value=''}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
